name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 2.0.1)'
        required: true
        default: ''

run-name: Build release v${{ github.event.inputs.version }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The changelog becomes the release notes and the extension's "What's new" dialog, so it can't be empty
      - name: Check the changelog
        run: |
          if ! grep -q '[^[:space:]]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md is empty. Add this release's changes before releasing."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The manifests are generated from package.json's version at build time
      - name: Set version
        run: npm pkg set version=${{ github.event.inputs.version }}

      - name: Check and build
        run: pnpm check

      - name: Create ZIP files
        run: |
          VERSION=${{ github.event.inputs.version }}
          (cd dist/chrome && zip -r ../../real-estate-comments-chrome-v$VERSION.zip .)
          (cd dist/firefox && zip -r ../../real-estate-comments-firefox-v$VERSION.zip .)
          # Firefox Add-ons asks for the source code of bundled extensions
          git archive --format zip -o real-estate-comments-source-v$VERSION.zip HEAD

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push origin HEAD:${{ github.ref }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body_path: CHANGELOG.md
          files: |
            real-estate-comments-chrome-v${{ github.event.inputs.version }}.zip
            real-estate-comments-firefox-v${{ github.event.inputs.version }}.zip
            real-estate-comments-source-v${{ github.event.inputs.version }}.zip

      # The release (and the extension built for it) has its notes. Keep them in CHANGELOG-ARCHIVE.md (newest first,
      # dated in Sydney time), then start the next release's changelog empty, so they don't carry over into the next
      # version's "What's new". `pnpm check` above has already format-checked CHANGELOG.md, so the archive stays
      # Prettier-clean.
      - name: Archive and clear the changelog
        run: |
          VERSION=${{ github.event.inputs.version }}
          DATE=$(TZ=Australia/Sydney date '+%-d %B %Y')
          {
            printf '## v%s (%s)\n\n' "$VERSION" "$DATE"
            cat CHANGELOG.md
            if [ -s CHANGELOG-ARCHIVE.md ]; then
              printf '\n'
              cat CHANGELOG-ARCHIVE.md
            fi
          } > CHANGELOG-ARCHIVE.md.new
          mv CHANGELOG-ARCHIVE.md.new CHANGELOG-ARCHIVE.md
          : > CHANGELOG.md
          git add CHANGELOG.md CHANGELOG-ARCHIVE.md
          git commit -m "chore: archive and clear changelog after v$VERSION"
          git push origin HEAD:${{ github.ref }}
